services:
  db:
    image: mongo:7
    container_name: raizes_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: raizes_api
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      PORT: "${PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node --experimental-transform-types scripts/seed.ts && node dist/server.js"

volumes:
  mongodata:
